[module/battery]
type = internal/battery

; This is useful in case the battery never reports 100% charge
; Default: 100
full-at = 100

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 10

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP1

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
; Default: 5
poll-interval = 5

format-charging =  <label-charging> <animation-charging>
format-discharging = <label-discharging> <bar-capacity> 

label-charging = %{F#b36d43}NRG%{F-} %percentage%%

label-discharging = %{F#b36d43}BAT%{F-} %percentage%%

label-full = %{F#b36d43}CHARGED%{F-}

animation-charging-framerate = 750

animation-charging-0 = :
animation-charging-1 = ̣.
animation-charging-2 = " "
animation-charging-3 = .

bar-capacity-format = %{T2}%fill%%indicator%%empty%%{T-}
bar-capacity-width = 20

; Defines the text color of the filled part.
; If the gradient is enabled, the filled part's color is a gradient using the listed colors.
; Otherwise the entire filled part will have the same color, based on the current value.
bar-capacity-gradient = true
bar-capacity-foreground-0 = #00ff00
bar-capacity-foreground-1 = #ff9900
bar-capacity-foreground-2 = #ff0000

; The fill, indicator and empty icon can be configured like any <label>
bar-capacity-fill = █
bar-capacity-indicator = █
bar-capacity-empty = █
